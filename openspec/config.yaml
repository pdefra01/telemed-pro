schema: spec-driven

context: |
  Tech stack: React 19, TypeScript ~5.8, Vite 6, Tailwind CSS 4, Express 5 (server.js), Supabase, LiveKit, Zod
  Architecture: Clean Architecture (Repositories in src/repositories, Services in src/services), Pages/Components
  Testing: Vitest, React Testing Library, Playwright (E2E)
  Style: standard, lucide-react icons

strict_tdd: true

testing:
  runner: vitest
  command: npm run test
  coverage: npx vitest run --coverage
  typecheck: npx tsc --noEmit
  layers:
    unit: vitest
    integration: vitest + @testing-library/react
    e2e: playwright

rules:
  proposal:
    - Identify affected repositories, services, or server endpoints
  specs:
    - Use Given/When/Then format for scenarios
  design:
    - Document architectural boundaries (UI -> Service -> Repository -> Supabase / Server API)
  tasks:
    - Separate logic/repository testing from UI component testing tasks
  apply:
    - Write tests FIRST (TDD) before implementation code
  verify:
    - Ensure all unit and integration tests pass cleanly
